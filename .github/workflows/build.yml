name: Ultimate Auto-Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Extract, Setup & Build APK via Cordova
        run: |
          echo "Checking for zip files..."
          UNZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          
          mkdir -p app_source
          if [ -n "$UNZIP_FILE" ]; then
            echo "Extracting $UNZIP_FILE..."
            unzip -q "$UNZIP_FILE" -d app_source
          else
            echo "No zip found, copying files..."
            cp -r * app_source/ 2>/dev/null || true
          fi

          cd app_source
          
          FIRST_DIR=$(ls -d */ 2>/dev/null | grep -v 'node_modules/' | head -n 1)
          if [ -n "$FIRST_DIR" ] && [ "$FIRST_DIR" != "app_source/" ]; then
            cd "$FIRST_DIR"
          fi

          rm -rf platforms plugins node_modules package-lock.json

          if [ ! -f "package.json" ]; then
            npm init -y
          fi

          # Install Cordova globally and locally
          npm install -g cordova
          npm install cordova --save --legacy-peer-deps || true

          # Set up a clean Cordova project structure if config.xml is missing
          if [ ! -f "config.xml" ]; then
            cordova create . com.mql5.eastudio MQL5EAStudio || true
          fi

          # Ensure www folder and index.html exist
          mkdir -p www
          if [ -d "src" ] && [ "$(ls -A src)" ]; then
            cp -r src/* www/ 2>/dev/null || true
          elif [ -d "public" ] && [ "$(ls -A public)" ]; then
            cp -r public/* www/ 2>/dev/null || true
          fi

          if [ ! -f "www/index.html" ]; then
            echo '<!DOCTYPE html><html><head><title>MQL5 EA Studio</title></head><body><h1>MQL5 EA Studio App</h1></body></html>' > www/index.html
          fi

          # Add android platform and build debug APK directly
          cordova platform add android --nosave || true
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mql5-ea-studio-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
