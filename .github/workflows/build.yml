name: Ultimate Auto-Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Extract, Setup & Build APK
        run: |
          echo "Checking for zip files..."
          UNZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          
          mkdir -p app_source
          if [ -n "$UNZIP_FILE" ]; then
            echo "Extracting $UNZIP_FILE..."
            unzip -q "$UNZIP_FILE" -d app_source
          else
            echo "No zip found, copying files..."
            cp -r * app_source/ 2>/dev/null || true
          fi

          cd app_source
          
          FIRST_DIR=$(ls -d */ 2>/dev/null | grep -v 'node_modules/' | head -n 1)
          if [ -n "$FIRST_DIR" ] && [ "$FIRST_DIR" != "app_source/" ]; then
            cd "$FIRST_DIR"
          fi

          # Clean and recreate fresh android project structure
          rm -rf android
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/java/com/mql5/eastudio

          # Write simple and direct settings.gradle
          echo "rootProject.name='MQL5EAStudio'" > android/settings.gradle
          echo "include ':app'" >> android/settings.gradle

          # Write standard root build.gradle compatible with Gradle CLI
          cat << 'EOF' > android/build.gradle
          plugins {
              id 'com.android.application' version '8.1.1' apply false
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # Write app/build.gradle
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.mql5.eastudio'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.mql5.eastudio'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

          # Copy web assets
          if [ -d "www" ]; then
            cp -r www/* android/app/src/main/assets/ 2>/dev/null || true
          elif [ -d "src" ]; then
            cp -r src/* android/app/src/main/assets/ 2>/dev/null || true
          else
            echo "<html><body><h1>MQL5 EA Studio</h1></body></html>" > android/app/src/main/assets/index.html
          fi

          cd android
          
          # Build directly using system gradle to bypass wrapper issues completely
          gradle clean assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mql5-ea-studio-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/android/app/build/outputs/apk/debug/*.apk
