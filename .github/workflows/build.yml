name: Ultimate Auto-Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Extract, Setup & Build APK
        run: |
          echo "Checking for zip files..."
          UNZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          
          mkdir -p app_source
          if [ -n "$UNZIP_FILE" ]; then
            echo "Extracting $UNZIP_FILE..."
            unzip -q "$UNZIP_FILE" -d app_source
          else
            echo "No zip found, copying files..."
            cp -r * app_source/ 2>/dev/null || true
          fi

          cd app_source
          
          FIRST_DIR=$(ls -d */ 2>/dev/null | grep -v 'node_modules/' | head -n 1)
          if [ -n "$FIRST_DIR" ] && [ "$FIRST_DIR" != "app_source/" ]; then
            cd "$FIRST_DIR"
          fi

          # Clean old builds and setup a fresh Android project
          rm -rf android
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/java/com/mql5/eastudio
          mkdir -p android/gradle/wrapper

          echo "rootProject.name='MQL5EAStudio'" > settings.gradle
          echo "include ':app'" >> settings.gradle

          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.1' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle

          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { namespace 'com.mql5.eastudio'; compileSdk 34; defaultConfig { applicationId 'com.mql5.eastudio'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' } }" >> app/build.gradle

          if [ -d "www" ]; then
            cp -r www/* app/src/main/assets/ 2>/dev/null || true
          elif [ -d "src" ]; then
            cp -r src/* app/src/main/assets/ 2>/dev/null || true
          else
            echo "<html><body><h1>MQL5 EA Studio</h1></body></html>" > app/src/main/assets/index.html
          fi

          cd android
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties

          echo '#!/usr/bin/env sh' > gradlew
          echo 'exec gradle "$@"' >> gradlew
          chmod +x gradlew
          
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mql5-ea-studio-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/android/app/build/outputs/apk/debug/*.apk
