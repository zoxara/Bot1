name: Ultimate Auto-Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Extract, Setup & Build APK
        run: |
          echo "Checking for zip files..."
          UNZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          
          mkdir -p app_source
          if [ -n "$UNZIP_FILE" ]; then
            echo "Extracting $UNZIP_FILE..."
            unzip -q "$UNZIP_FILE" -d app_source
          else
            echo "No zip found, copying files..."
            cp -r * app_source/ 2>/dev/null || true
          fi

          cd app_source
          
          FIRST_DIR=$(ls -d */ 2>/dev/null | grep -v 'node_modules/' | head -n 1)
          if [ -n "$FIRST_DIR" ] && [ "$FIRST_DIR" != "app_source/" ]; then
            cd "$FIRST_DIR"
          fi

          rm -rf android node_modules package-lock.json

          if [ ! -f "package.json" ]; then
            npm init -y
          fi

          # Ensure a valid www folder with index.html exists before capacitor setup
          mkdir -p www
          if [ -d "src" ] && [ "$(ls -A src)" ]; then
            cp -r src/* www/ 2>/dev/null || true
          fi
          
          if [ ! -f "www/index.html" ]; then
            echo '<!DOCTYPE html><html><head><title>MQL5 EA Studio</title></head><body><h1>MQL5 EA Studio App</h1></body></html>' > www/index.html
          fi

          npm install @capacitor/core @capacitor/cli --save --legacy-peer-deps || true
          npm install @capacitor/android --save --legacy-peer-deps || true
          npm install --legacy-peer-deps || npm install || true

          # Force correct capacitor config pointing to www
          echo '{
            "appId": "com.mql5.eastudio",
            "appName": "MQL5 EA Studio",
            "webDir": "www",
            "bundledWebRuntime": false
          }' > capacitor.config.json

          npx cap add android
          npx cap sync android || true

          if [ -d "android" ]; then
            cd android
            
            if [ -f "build.gradle" ]; then
              sed -i "s/com.android.tools.build:gradle:.*/com.android.tools.build:gradle:8.1.1'/g" build.gradle || true
            fi

            mkdir -p gradle/wrapper
            echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties

            chmod +x gradlew || true
            ./gradlew clean assembleDebug --stacktrace
          else
            echo "Error: Android folder could not be created!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mql5-ea-studio-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/android/app/build/outputs/apk/debug/*.apk
            
